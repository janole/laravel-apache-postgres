name: Scan Image

on:
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * *'

jobs:
  check-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Image Name
        run: |
          echo "IMAGE=janole/laravel-apache-postgres:$(cat version)-php83-node" >> "$GITHUB_ENV"

      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true

      - name: Run trivy
        # Pinned to a commit SHA so a moved or rewritten tag cannot change what runs here.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE }}"
          # npm's own bundled dependencies lag Trivy's database, so a scan that includes them
          # never passes. npm only runs at build time and is not reachable from the web app.
          skip-dirs: "/usr/lib/node_modules/npm"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "MEDIUM,HIGH,CRITICAL"
        env:
          TRIVY_DB_REPOSITORY: aquasec/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: aquasec/trivy-java-db:1

      - name: Try to start build workflow if trivy failed
        if: ${{ failure() }}
        run: |
          curl -X POST -u ${{ secrets.PAT }} -H "Accept: application/vnd.github.v3+json" -d '{"ref":"refs/heads/master"}' https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches
