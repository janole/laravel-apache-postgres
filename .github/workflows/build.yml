name: Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

# All runs push the same tags (e.g. 0-php83), so only one may run at a time.
# A newer run cancels an older one: it always builds from the newer base images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to Docker
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
    - name: Run the build script ...
      run: PLATFORM="--platform linux/amd64,linux/arm64/v8" ./build.sh
    - name: Delete the docker password just to be on the safe side ...
      run: rm -f /home/runner/.docker/config.json
