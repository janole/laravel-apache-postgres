name: Check Upstream

# Trivy cannot see PHP itself (the official php images compile it from source), so a new
# PHP release never fails the scan. Instead, compare the upstream php image digest with the
# one our images were built from, and start a build when they differ.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  IMAGE: janole/laravel-apache-postgres

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare base image digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          busy=$(gh run list -R "$GITHUB_REPOSITORY" -w build.yml -b master -L 5 \
            --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" -gt 0 ]; then
            echo "A build is already queued or running; nothing to do."
            exit 0
          fi

          # Base targets are the ones with a BASE_IMAGE arg in docker-bake.hcl.
          bases=$(docker buildx bake --print 2>/dev/null \
            | jq -r '.target | to_entries[] | select(.value.args.BASE_IMAGE) | "\(.key) \(.value.args.BASE_IMAGE)"')

          stale=""
          while read -r target ref; do
            upstream=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
            # Empty when the image doesn't exist yet (new target) or has no label (older builds).
            ours=$(docker buildx imagetools inspect "$IMAGE:0-$target" --format '{{json .Image}}' 2>/dev/null \
              | jq -r '(if has("config") then . else (.["linux/amd64"] // first(.[])) end)
                       | .config.Labels["org.opencontainers.image.base.name"] // ""' || true)
            echo "$target: upstream $ref@$upstream, ours built from ${ours:-<unknown>}"
            if [ "$ours" != "$ref@$upstream" ]; then
              stale="$stale $target"
            fi
          done <<< "$bases"

          if [ -n "$stale" ]; then
            echo "Outdated:$stale. Starting a build."
            gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref master
          else
            echo "All images are built from the current upstream images."
          fi
